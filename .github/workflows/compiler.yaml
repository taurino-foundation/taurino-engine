name: Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64-bit
          - target: x86_64-pc-windows-msvc
            os: windows-2025

          # Windows 32-bit
          - target: i686-pc-windows-msvc
            os: windows-2025

          # macOS Intel / x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel

          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # webkit2gtk / gtk need native system libraries on Linux.
      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

      - name: Cargo check
        shell: bash
        run: |
          cargo check \
            --locked \
            --all-targets \
            --target ${{ matrix.target }}

      - name: Compile tests
        shell: bash
        run: |
          cargo test \
            --locked \
            --no-run \
            --target ${{ matrix.target }}